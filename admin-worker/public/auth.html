<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Heritage · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Archive-ledger monochrome (same token layer as chat + admin) */
    --bg:#fafafa; --card:#fff; --field:#f1f1f1;
    --acc:#0a0a0a; --acc-soft:rgba(10,10,10,.06); --acc-line:rgba(10,10,10,.3);
    --ink:#0a0a0a; --muted:rgba(10,10,10,.56); --faint:rgba(10,10,10,.4);
    --line:rgba(0,0,0,.09); --line-2:rgba(0,0,0,.16);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Poppins",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="dark"] {
    --bg:#0e0e0e; --card:#161616; --field:#1e1e1e;
    --acc:#f2f2f2; --acc-soft:rgba(255,255,255,.08); --acc-line:rgba(255,255,255,.4);
    --ink:#f2f2f2; --muted:rgba(255,255,255,.5); --faint:rgba(255,255,255,.32);
    --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.2);
  }
  * { box-sizing:border-box; border-radius:0 !important; }
  html,body { height:100%; }
  body { margin:0; font:500 15px/1.55 var(--sans); color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100%; }
  ::selection { background:var(--acc); color:var(--card); }
  a { color:inherit; }

  .top { display:flex; justify-content:center; padding:36px 20px 0; position:relative; }
  .brand { display:flex; align-items:center; gap:11px; text-decoration:none; }
  .theme-toggle-top { position:absolute; right:20px; top:36px; border:1px solid var(--line-2); background:var(--card);
    color:var(--ink); padding:6px 8px; cursor:pointer; display:inline-flex; align-items:center; transition:.15s; }
  .theme-toggle-top:hover { background:var(--acc-soft); }
  .sun-icon, .moon-icon { display:block; }
  .sun-icon.hidden, .moon-icon.hidden { display:none; }
  .brand .mark { width:34px; height:34px; background:var(--acc);
    color:var(--card); display:grid; place-items:center; font:700 16px var(--mono); }
  .brand .x1 { font:700 17px var(--sans); letter-spacing:-.2px; }
  .brand .x2 { font:700 9px var(--mono); letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }

  .wrap { flex:1; display:grid; place-items:center; padding:30px 18px 50px; }
  .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line-2); padding:32px 30px; }

  .hgroup { text-align:center; margin-bottom:28px; }
  .badge { width:48px; height:48px; margin:0 auto 16px; background:var(--acc);
    color:var(--card); display:grid; place-items:center; }
  .badge svg { width:24px; height:24px; }
  h1 { margin:0 0 7px; font:800 24px/1.15 var(--sans); letter-spacing:-.5px; }
  .sub { margin:0; font:700 9.5px var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }

  form { display:flex; flex-direction:column; gap:14px; }
  .field label { display:block; margin:0 0 7px 1px; font:700 9.5px var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--faint); }
  .ip { position:relative; }
  .ip svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint); }
  .ip input { width:100%; height:46px; background:var(--field); border:1px solid var(--line);
    padding:0 13px 0 40px; color:var(--ink); font:13.5px var(--mono); outline:0; transition:.15s; }
  .ip input::placeholder { color:var(--faint); }
  .ip input:focus { border-color:var(--acc); }

  .btn { width:100%; height:46px; border:1px solid var(--acc); background:var(--acc); color:var(--card);
    font:800 10.5px var(--sans); letter-spacing:.2em; text-transform:uppercase; cursor:pointer; transition:.16s;
    display:flex; align-items:center; justify-content:center; gap:9px; margin-top:4px; }
  .btn:hover:not(:disabled) { opacity:.82; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn svg { width:15px; height:15px; }
  .ghost { width:100%; height:44px; border:1px solid var(--line-2); background:transparent;
    color:var(--muted); font:700 10px var(--mono); letter-spacing:.18em; text-transform:uppercase; cursor:pointer; transition:.15s; }
  .ghost:hover { color:var(--ink); background:var(--acc-soft); }

  .status { min-height:18px; font:600 12px var(--mono); text-align:center; color:var(--muted); }
  .status.err { color:var(--ink); text-decoration:underline; text-decoration-style:dashed; text-underline-offset:3px; }
  .status.ok { color:var(--ink); }
  .switch { margin-top:24px; padding-top:18px; border-top:1px solid var(--line); text-align:center; font:500 12.5px var(--sans); color:var(--faint); }
  a.ghost { display:grid; place-items:center; text-decoration:none; color:var(--muted); box-sizing:border-box; }
  .switch a { color:var(--ink); font:700 12.5px var(--sans); margin-left:5px; text-decoration:none; border-bottom:1px solid var(--acc); }
  .status a { color:inherit; font-weight:700; }
  .switch button { border:0; background:transparent; color:var(--ink); font:700 12.5px var(--sans); cursor:pointer; padding:0; margin-left:5px; border-bottom:1px solid var(--acc); }
  .foot { text-align:center; color:var(--faint); font:600 9.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; padding-bottom:28px; }

  @media (max-width:480px){
    .card { padding:26px 20px; }
    .ip input { font-size:16px; } /* ≥16px stops iOS focus zoom */
  }
</style>
</head>
<body>
  <div class="top">
    <a class="brand" href="/" title="Heritage">
      <span class="mark">H</span>
      <div><div class="x1">Heritage</div><div class="x2">Ga Language Companion</div></div>
    </a>
    <button class="theme-toggle-top" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg class="moon-icon hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="hgroup">
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
        </div>
        <h1 id="title">Admin console</h1>
        <p class="sub" id="subtitle">Sign in with an admin account</p>
      </div>

      <form id="form" autocomplete="on">
        <div class="field">
          <label for="email">Email address</label>
          <div class="ip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
            <input type="email" id="email" placeholder="name@example.com" autocomplete="username" required />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="ip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
        </div>
        <button class="btn" id="submitBtn" type="submit">
          <span id="btnText">Sign in</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
        <a class="ghost" id="guestBtn" href="https://heritage-rag.heritage-app.workers.dev/">Go to the Heritage app</a>
        <div class="status" id="status"></div>
      </form>

      <div class="switch">
        <span id="switchText">No admin account?</span>
        <a id="switchBtn" href="https://heritage-rag.heritage-app.workers.dev/auth">Sign in to the app instead</a>
      </div>
    </div>
  </div>

  <div class="foot">Heritage · Your Ga language companion</div>

<script>
const API = "/api/v1";
const $ = (id) => document.getElementById(id);
let kind = "login";

// Theme switching
function initTheme() {
  const savedTheme = localStorage.getItem("theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const theme = savedTheme || (prefersDark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  updateThemeIcons(theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  const next = current === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  updateThemeIcons(next);
}
function updateThemeIcons(theme) {
  const sun = document.querySelector(".sun-icon");
  const moon = document.querySelector(".moon-icon");
  if (sun && moon) {
    sun.classList.toggle("hidden", theme === "dark");
    moon.classList.toggle("hidden", theme === "light");
  }
}
initTheme();
document.getElementById("themeToggle")?.addEventListener("click", toggleTheme);

const APP_URL = "https://heritage-rag.heritage-app.workers.dev";
// A signed-in admin goes straight in. Anyone else is told plainly — sending
// them to "/" bounced back to the console's own gate, round and round.
function denied(email) {
  const s = $("status");
  s.className = "status err";
  s.innerHTML = "";
  s.append(`${email || "This account"} isn't an admin. `);
  const a = document.createElement("a");
  a.href = APP_URL + "/"; a.textContent = "Open the Heritage app →";
  s.appendChild(a);
}
(async function () {
  try {
    const r = await fetch(`${API}/auth/session`, { credentials: "include" });
    if (r.ok) {
      const d = await r.json(), u = d.user;
      if (u && u.role === "admin") { window.location.href = "/admin.html"; return; }
      if (u) {
        // Clear this console's session so the form can be used with an admin account.
        await fetch(`${API}/auth/logout`, { method: "POST", credentials: "include" }).catch(() => {});
        denied(u.email);
      }
    }
  } catch {}
  if (new URLSearchParams(location.search).get("denied") && !$("status").textContent) denied("");
})();

function setKind(k) {
  kind = k;
  const login = k === "login";
  $("title").textContent = login ? "Welcome back" : "Start your journey";
  $("subtitle").textContent = login ? "Access your Heritage repository" : "Join the linguistic preservation engine";
  $("btnText").textContent = login ? "Sign in" : "Create account";
  $("switchText").textContent = login ? "New to the engine?" : "Already have an account?";
  $("switchBtn").textContent = login ? "Create an account" : "Sign in here";
  $("password").setAttribute("autocomplete", login ? "current-password" : "new-password");
  $("status").textContent = ""; $("status").className = "status";
}

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const status = $("status"); status.className = "status"; status.textContent = "Please wait…";
  $("submitBtn").disabled = true;
  try {
    const r = await fetch(`${API}/auth/${kind}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
      body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value }),
    });
    const d = await r.json();
    if (!r.ok) {
      if (r.status === 403 && d.app) { denied($("email").value.trim()); $("submitBtn").disabled = false; return; }
      status.className = "status err"; status.textContent = d.detail || "Something went wrong"; $("submitBtn").disabled = false; return;
    }
    if (!d.user || d.user.role !== "admin") {
      await fetch(`${API}/auth/logout`, { method: "POST", credentials: "include" }).catch(() => {});
      denied(d.user && d.user.email); $("submitBtn").disabled = false; return;
    }
    status.className = "status ok"; status.textContent = "Signed in — opening the console…";
    window.location.href = "/admin.html";
  } catch (err) {
    status.className = "status err"; status.textContent = err.message; $("submitBtn").disabled = false;
  }
};
</script>
</body>
</html>
