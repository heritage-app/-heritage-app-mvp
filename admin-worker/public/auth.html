<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Heritage · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#FBF7F1; --card:#ffffff; --field:#FBF7F1; --paper-2:#F5EEE3; --paper-3:#EFE6D8;
    --ink:#16130F; --ink-2:rgba(22,19,15,.74); --muted:rgba(22,19,15,.58); --faint:rgba(22,19,15,.42);
    --line:#EFE6D8; --line-2:#E2D6C3; --accent:#F2B33D; --accent-ink:#7A5200; --sky:#E1ECFA; --sky-ink:#1E5AA8;
    --blush:#FBE4E3; --blush-ink:#A3312A; --sage:#E3F1E4; --sage-ink:#1F7A4A;
    --acc:var(--ink); --acc-soft:var(--paper-2); --acc-line:var(--line-2);
    --sans:"Plus Jakarta Sans",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
    --display:"Bricolage Grotesque","Plus Jakarta Sans",ui-sans-serif,sans-serif;
    --mono:var(--sans);
  }
  [data-theme="dark"] {
    --bg:#141414; --card:#1c1c1c; --field:#141414; --paper-2:#232323; --paper-3:#2a2a2c;
    --ink:#f5f5f5; --ink-2:rgba(255,255,255,.74); --muted:rgba(255,255,255,.55); --faint:rgba(255,255,255,.36);
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18); --accent-ink:#F2B33D; --sky:#1B2433; --sky-ink:#9CC0F0;
    --blush:#2F1E1D; --blush-ink:#F2A79F; --sage:#1C2A21; --sage-ink:#8FD4A9;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font:500 15px/1.55 var(--sans); color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100%; }
  a { color:inherit; }
  .hidden { display:none !important; }
  .top { display:flex; align-items:center; justify-content:space-between; padding:20px 28px; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand .mark { width:34px; height:34px; border-radius:11px; background:var(--ink); color:var(--bg); display:grid; place-items:center; font:800 16px var(--display); }
  .brand .x1 { font:800 21px var(--display); letter-spacing:-.4px; }
  .brand .x2 { display:inline-block; margin-left:2px; padding:4px 9px; border-radius:999px; background:var(--sky); color:var(--sky-ink); font:800 10px var(--sans); letter-spacing:.06em; }
  .brand > div { display:flex; align-items:center; gap:8px; }
  .theme-toggle-top { width:44px; height:44px; border:0; border-radius:50%; background:var(--paper-2); color:var(--ink); display:grid; place-items:center; cursor:pointer; }
  .sun-icon, .moon-icon { display:block; } .sun-icon.hidden, .moon-icon.hidden { display:none; }
  .wrap { flex:1; display:grid; place-items:center; padding:12px 16px 48px; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:28px; padding:28px; }
  .hgroup { display:grid; grid-template-columns:auto minmax(0, 1fr); column-gap:12px; row-gap:2px; align-items:center; margin-bottom:22px; text-align:left; }
  .hgroup .badge { grid-row:span 2; }
  .hgroup h1 { align-self:end; }
  .hgroup .sub { align-self:start; grid-column:2; }
  .badge { width:48px; height:48px; flex:none; border-radius:16px; background:var(--accent); color:#16130F; display:grid; place-items:center; margin:0; }
  .badge svg { width:22px; height:22px; }
  h1 { margin:0; font:800 24px/1.1 var(--display); letter-spacing:-.4px; }
  .sub { margin:3px 0 0; font:500 14px var(--sans); color:var(--muted); letter-spacing:0; text-transform:none; }
  form { display:flex; flex-direction:column; gap:14px; }
  .field label { display:block; margin:0 0 6px 2px; font:700 13px var(--sans); color:var(--ink-2); letter-spacing:0; text-transform:none; }
  .ip { position:relative; }
  .ip svg { display:none; }
  .ip input { width:100%; min-height:52px; border:0; border-radius:16px; background:var(--field); box-shadow:inset 0 0 0 1px var(--line-2); padding:0 16px; color:var(--ink); font:500 16px var(--sans); outline:0; }
  .ip input::placeholder { color:var(--faint); }
  .ip input:focus { box-shadow:inset 0 0 0 2px var(--ink); }
  .btn { width:100%; min-height:52px; border:0; border-radius:999px; background:var(--ink); color:var(--bg); font:700 15px var(--sans); letter-spacing:0; text-transform:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:2px; }
  .btn:disabled { opacity:.55; cursor:progress; }
  .btn svg { width:16px; height:16px; }
  .ghost, a.ghost { width:100%; min-height:48px; display:grid; place-items:center; border:0; border-radius:999px; box-shadow:inset 0 0 0 1.5px var(--line-2); background:transparent; color:var(--ink); font:700 14px var(--sans); letter-spacing:0; text-transform:none; text-decoration:none; cursor:pointer; }
  .ghost:hover { background:var(--paper-2); }
  .status { min-height:0; font:600 13.5px/1.45 var(--sans); text-align:left; color:var(--muted); border-radius:14px; text-decoration:none; }
  .status:empty { display:none; }
  .status.err { background:var(--blush); color:var(--blush-ink); padding:11px 14px; text-decoration:none; }
  .status.ok { background:var(--sage); color:var(--sage-ink); padding:11px 14px; }
  .status a { color:inherit; font-weight:800; }
  .switch { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); text-align:center; font:500 13.5px var(--sans); color:var(--muted); }
  .switch a, .switch button { color:var(--ink); font:700 13.5px var(--sans); margin-left:5px; text-decoration:underline; text-underline-offset:3px; border:0; background:none; }
  .foot { text-align:center; color:var(--faint); font:500 12.5px var(--sans); letter-spacing:0; text-transform:none; padding-bottom:24px; }
</style>
</head>
<body>
  <div class="top">
    <a class="brand" href="/" title="Heritage">
      <span class="mark">H</span>
      <div><span class="x1">Heritage</span><span class="x2">ADMIN</span></div>
    </a>
    <button class="theme-toggle-top" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg class="moon-icon hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="hgroup">
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
        </div>
        <h1 id="title">Admin console</h1>
        <p class="sub" id="subtitle">Sign in with an admin account</p>
      </div>

      <form id="form" autocomplete="on">
        <div class="field">
          <label for="email">Email address</label>
          <div class="ip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
            <input type="email" id="email" placeholder="name@example.com" autocomplete="username" required />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="ip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
        </div>
        <button class="btn" id="submitBtn" type="submit">
          <span id="btnText">Sign in</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
        <a class="ghost" id="guestBtn" href="https://heritage-rag.heritage-app.workers.dev/">Go to the Heritage app</a>
        <div class="status" id="status"></div>
      </form>

      <div class="switch">
        <span id="switchText">No admin account?</span>
        <a id="switchBtn" href="https://heritage-rag.heritage-app.workers.dev/auth">Sign in to the app instead</a>
      </div>
    </div>
  </div>

  <div class="foot">Heritage · Your Ga language companion</div>

<script>
const API = "/api/v1";
const $ = (id) => document.getElementById(id);
let kind = "login";

// Theme switching
function initTheme() {
  const savedTheme = localStorage.getItem("theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const theme = savedTheme || (prefersDark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  updateThemeIcons(theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  const next = current === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  updateThemeIcons(next);
}
function updateThemeIcons(theme) {
  const sun = document.querySelector(".sun-icon");
  const moon = document.querySelector(".moon-icon");
  if (sun && moon) {
    sun.classList.toggle("hidden", theme === "dark");
    moon.classList.toggle("hidden", theme === "light");
  }
}
initTheme();
document.getElementById("themeToggle")?.addEventListener("click", toggleTheme);

const APP_URL = "https://heritage-rag.heritage-app.workers.dev";
// A signed-in admin goes straight in. Anyone else is told plainly — sending
// them to "/" bounced back to the console's own gate, round and round.
function denied(email) {
  const s = $("status");
  s.className = "status err";
  s.innerHTML = "";
  s.append(`${email || "This account"} isn't an admin. `);
  const a = document.createElement("a");
  a.href = APP_URL + "/"; a.textContent = "Open the Heritage app →";
  s.appendChild(a);
}
(async function () {
  try {
    const r = await fetch(`${API}/auth/session`, { credentials: "include" });
    if (r.ok) {
      const d = await r.json(), u = d.user;
      if (u && u.role === "admin") { window.location.href = "/admin.html"; return; }
      if (u) {
        // Clear this console's session so the form can be used with an admin account.
        await fetch(`${API}/auth/logout`, { method: "POST", credentials: "include" }).catch(() => {});
        denied(u.email);
      }
    }
  } catch {}
  if (new URLSearchParams(location.search).get("denied") && !$("status").textContent) denied("");
})();

function setKind(k) {
  kind = k;
  const login = k === "login";
  $("title").textContent = login ? "Welcome back" : "Start your journey";
  $("subtitle").textContent = login ? "Access your Heritage repository" : "Join the linguistic preservation engine";
  $("btnText").textContent = login ? "Sign in" : "Create account";
  $("switchText").textContent = login ? "New to the engine?" : "Already have an account?";
  $("switchBtn").textContent = login ? "Create an account" : "Sign in here";
  $("password").setAttribute("autocomplete", login ? "current-password" : "new-password");
  $("status").textContent = ""; $("status").className = "status";
}

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const status = $("status"); status.className = "status"; status.textContent = "Please wait…";
  $("submitBtn").disabled = true;
  try {
    const r = await fetch(`${API}/auth/${kind}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
      body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value }),
    });
    const d = await r.json();
    if (!r.ok) {
      if (r.status === 403 && d.app) { denied($("email").value.trim()); $("submitBtn").disabled = false; return; }
      status.className = "status err"; status.textContent = d.detail || "Something went wrong"; $("submitBtn").disabled = false; return;
    }
    if (!d.user || d.user.role !== "admin") {
      await fetch(`${API}/auth/logout`, { method: "POST", credentials: "include" }).catch(() => {});
      denied(d.user && d.user.email); $("submitBtn").disabled = false; return;
    }
    status.className = "status ok"; status.textContent = "Signed in — opening the console…";
    window.location.href = "/admin.html";
  } catch (err) {
    status.className = "status err"; status.textContent = err.message; $("submitBtn").disabled = false;
  }
};
</script>
</body>
</html>
