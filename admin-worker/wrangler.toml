name = "heritage-admin"
account_id = "7c43e5e869ffbe4a0e6ab4286cf4e073"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# admin.speakga.org is the admin console only — the public app is never served
# here. heritage-admin.heritage-app.workers.dev keeps working.
routes = [{ pattern = "admin.speakga.org", custom_domain = true }]
workers_dev = true

# Standalone admin console: serves admin.html/auth.html as static assets and
# proxies /api/* to the main API worker so cookie auth stays same-origin.
[assets]
directory = "./public"

# Service binding: direct worker-to-worker fetch (workers.dev URLs can't be
# fetched from inside a Worker — error 1042). env.API forwards to heritage-rag.
[[services]]
binding = "API"
service = "heritage-rag"
