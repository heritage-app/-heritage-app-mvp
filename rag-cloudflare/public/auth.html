<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heritage · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Light theme (default) */
    --bg:#f8f9fa; --card:#ffffff; --field:#f1f3f4;
    --gold:#c4963f; --gold-soft:rgba(196,150,63,.12); --gold-line:rgba(196,150,63,.3);
    --white:#fff; --muted:rgba(26,26,26,.56); --faint:rgba(26,26,26,.4); --line:rgba(0,0,0,.08);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Poppins",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="dark"] {
    /* Dark theme */
    --bg:#141414; --card:#0d0d0d; --field:#1c1c1c;
    --gold:#c4963f; --gold-soft:rgba(196,150,63,.12); --gold-line:rgba(196,150,63,.28);
    --white:#fff; --muted:rgba(255,255,255,.42); --faint:rgba(255,255,255,.22); --line:rgba(255,255,255,.08);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font:500 15px/1.55 var(--sans); color:var(--white);
    background:
      radial-gradient(900px 420px at 50% -8%, rgba(196,150,63,.18), transparent 70%),
      var(--bg);
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100%; }
  ::selection { background:var(--gold); color:#0d0d0d; }
  a { color:inherit; }

  .top { display:flex; justify-content:center; padding:36px 20px 0; position:relative; }
  .brand { display:flex; align-items:center; gap:11px; text-decoration:none; }
  .theme-toggle-top { position:absolute; right:20px; top:36px; border:1px solid var(--line); background:var(--card); color:var(--white); border-radius:8px; padding:7px 9px; cursor:pointer; display:inline-flex; align-items:center; transition:.15s; }
  .theme-toggle-top:hover { background:var(--gold); color:#0d0d0d; border-color:var(--gold); }
  .sun-icon, .moon-icon { display:block; }
  .sun-icon.hidden, .moon-icon.hidden { display:none; }
  .brand .mark { width:34px; height:34px; border-radius:9px; background:var(--gold-soft); border:1px solid var(--gold-line);
    color:var(--gold); display:grid; place-items:center; font:700 16px var(--mono); }
  .brand .x1 { font:700 17px var(--sans); letter-spacing:-.2px; }
  .brand .x2 { font:700 9px var(--mono); letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }

  .wrap { flex:1; display:grid; place-items:center; padding:30px 18px 50px; }
  .card { position:relative; width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
    border-radius:26px; padding:34px 32px; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55); }
  .card::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to bottom, rgba(196,150,63,.10), transparent 45%); }
  .card > * { position:relative; }

  .hgroup { text-align:center; margin-bottom:30px; }
  .badge { width:56px; height:56px; margin:0 auto 18px; border-radius:16px; background:var(--gold-soft);
    border:1px solid var(--gold-line); display:grid; place-items:center; color:var(--gold); }
  .badge svg { width:27px; height:27px; }
  h1 { margin:0 0 7px; font:800 25px/1.15 var(--sans); letter-spacing:-.5px; }
  .sub { margin:0; font:700 10px var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }

  form { display:flex; flex-direction:column; gap:16px; }
  .field label { display:block; margin:0 0 8px 2px; font:800 10px var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--faint); }
  .ip { position:relative; }
  .ip svg { position:absolute; left:15px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--faint); }
  .ip input { width:100%; height:50px; background:var(--field); border:1px solid var(--line); border-radius:13px;
    padding:0 14px 0 44px; color:var(--white); font:14px var(--mono); outline:0; transition:.15s; }
  .ip input::placeholder { color:var(--faint); }
  .ip input:focus { border-color:var(--gold-line); box-shadow:0 0 0 3px var(--gold-soft); }

  .btn { width:100%; height:50px; border:0; border-radius:13px; background:var(--white); color:#0d0d0d;
    font:800 11px var(--sans); letter-spacing:.2em; text-transform:uppercase; cursor:pointer; transition:.16s;
    display:flex; align-items:center; justify-content:center; gap:9px; margin-top:4px; }
  .btn:hover:not(:disabled) { background:var(--gold); }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn svg { width:15px; height:15px; }
  .ghost { width:100%; height:48px; border:1px solid var(--line); border-radius:13px; background:transparent;
    color:var(--muted); font:700 10px var(--mono); letter-spacing:.18em; text-transform:uppercase; cursor:pointer; transition:.15s; }
  .ghost:hover { color:var(--white); background:rgba(255,255,255,.04); }

  .status { min-height:18px; font:600 12.5px var(--sans); text-align:center; color:var(--muted); }
  .status.err { color:#f0a3a3; } .status.ok { color:var(--gold); }
  .switch { margin-top:26px; text-align:center; font:500 13px var(--sans); color:var(--faint); }
  .switch button { border:0; background:transparent; color:var(--gold); font:700 13px var(--sans); cursor:pointer; padding:0; margin-left:5px; }
  .switch button:hover { text-decoration:underline; text-underline-offset:4px; }
  .foot { text-align:center; color:var(--faint); font:600 10px var(--mono); letter-spacing:.14em; text-transform:uppercase; padding-bottom:28px; }

  @media (max-width:480px){ .card { padding:28px 22px; border-radius:22px; } }
</style>
</head>
<body>
  <div class="top">
    <a class="brand" href="/" title="Heritage">
      <span class="mark">H</span>
      <div><div class="x1">Heritage</div><div class="x2">Ga Language Companion</div></div>
    </a>
    <button class="theme-toggle-top" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg class="moon-icon hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="hgroup">
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
        </div>
        <h1 id="title">Welcome back</h1>
        <p class="sub" id="subtitle">Access your Heritage repository</p>
      </div>

      <form id="form" autocomplete="on">
        <div class="field">
          <label for="email">Email address</label>
          <div class="ip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
            <input type="email" id="email" placeholder="name@example.com" autocomplete="username" required />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="ip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
        </div>
        <button class="btn" id="submitBtn" type="submit">
          <span id="btnText">Sign in</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
        <button class="ghost" id="guestBtn" type="button">Continue as guest</button>
        <div class="status" id="status"></div>
      </form>

      <div class="switch">
        <span id="switchText">New to the engine?</span>
        <button id="switchBtn" type="button">Create an account</button>
      </div>
    </div>
  </div>

  <div class="foot">Heritage · Your Ga language companion</div>

<script>
const API = "/api/v1";
const $ = (id) => document.getElementById(id);
let kind = "login";

// Theme switching
function initTheme() {
  const savedTheme = localStorage.getItem("theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const theme = savedTheme || (prefersDark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  updateThemeIcons(theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  const next = current === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  updateThemeIcons(next);
}
function updateThemeIcons(theme) {
  const sun = document.querySelector(".sun-icon");
  const moon = document.querySelector(".moon-icon");
  if (sun && moon) {
    sun.classList.toggle("hidden", theme === "dark");
    moon.classList.toggle("hidden", theme === "light");
  }
}
initTheme();
document.getElementById("themeToggle")?.addEventListener("click", toggleTheme);

(async function () {
  try {
    const r = await fetch(`${API}/auth/me`, { credentials: "include" });
    if (r.ok) { const u = await r.json(); window.location.href = u.role === "admin" ? "/admin" : "/"; }
  } catch {}
})();

function setKind(k) {
  kind = k;
  const login = k === "login";
  $("title").textContent = login ? "Welcome back" : "Start your journey";
  $("subtitle").textContent = login ? "Access your Heritage repository" : "Join the linguistic preservation engine";
  $("btnText").textContent = login ? "Sign in" : "Create account";
  $("switchText").textContent = login ? "New to the engine?" : "Already have an account?";
  $("switchBtn").textContent = login ? "Create an account" : "Sign in here";
  $("password").setAttribute("autocomplete", login ? "current-password" : "new-password");
  $("status").textContent = ""; $("status").className = "status";
}
$("switchBtn").onclick = () => setKind(kind === "login" ? "signup" : "login");
$("guestBtn").onclick = () => (window.location.href = "/");

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const status = $("status"); status.className = "status"; status.textContent = "Please wait…";
  $("submitBtn").disabled = true;
  try {
    const r = await fetch(`${API}/auth/${kind}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
      body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value }),
    });
    const d = await r.json();
    if (!r.ok) { status.className = "status err"; status.textContent = d.detail || "Something went wrong"; $("submitBtn").disabled = false; return; }
    status.className = "status ok"; status.textContent = "Success — redirecting…";
    window.location.href = d.user && d.user.role === "admin" ? "/admin" : "/";
  } catch (err) {
    status.className = "status err"; status.textContent = err.message; $("submitBtn").disabled = false;
  }
};
</script>
</body>
</html>
