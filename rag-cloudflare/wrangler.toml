name = "heritage-rag"
account_id = "7c43e5e869ffbe4a0e6ab4286cf4e073"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Domains: app.speakga.org is the app; speakga.org is the landing page (the Worker
# picks the page for "/" by hostname, see src/index.ts); www.speakga.org redirects.
routes = [
  { pattern = "app.speakga.org", custom_domain = true },
  { pattern = "speakga.org", custom_domain = true },
  { pattern = "www.speakga.org", custom_domain = true },
  # .com lands here too: the visit is logged, then 301'd to .org (replaces the
  # edge redirect so .com traffic counts in site analytics).
  { pattern = "speakga.com", custom_domain = true },
  { pattern = "www.speakga.com", custom_domain = true },
  # The API alone, for token clients (scripts, mobile, partners); see src/index.ts.
  { pattern = "api.speakga.org", custom_domain = true },
]
# Keep heritage-rag.heritage-app.workers.dev serving too: Wrangler turns it off once
# routes exist, and the admin console and older links still use that address.
workers_dev = true

# Static demo UI served from ./public (same-origin as the API at /api/v1, so
# auth cookies just work). Non-asset paths fall through to the Worker.
# "/" runs the Worker first so the root page can depend on the domain.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/landing", "/landing.html"]

# Workers AI (embeddings + LLM)
[ai]
binding = "AI"

# Vectorize index for semantic retrieval.
# Create it once with:
#   wrangler vectorize create heritage-index --dimensions=768 --metric=cosine
# Then create metadata indexes so we can filter by category/book/chapter/verse:
#   wrangler vectorize create-metadata-index heritage-index --property-name=category --type=string
#   wrangler vectorize create-metadata-index heritage-index --property-name=book --type=string
#   wrangler vectorize create-metadata-index heritage-index --property-name=chapter_num --type=number
#   wrangler vectorize create-metadata-index heritage-index --property-name=verse_num --type=number
[[vectorize]]
binding = "VECTORIZE"
index_name = "heritage-index"

# D1 (users, chat sessions, interactions, documents, bible_verses).
# Create it with:  wrangler d1 create heritage-db
# Then paste the returned database_id below and run the schema:
#   npm run db:schema:remote
[[d1_databases]]
binding = "DB"
database_name = "heritage-db"
database_id = "02ed413d-89ae-4e2f-b4d4-a9eebbba7220"

# R2 bucket for original document binaries.
# Create it with:  wrangler r2 bucket create heritage-documents
[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "heritage-documents"

[vars]
# Non-secret config. Secrets (JWT_SECRET) go in .dev.vars locally and
# `wrangler secret put JWT_SECRET` in production.
# Llama 3.3 70B (fp8, latency-optimized) handles the multi-scenario persona +
# strict guardrail prompts well. For lower cost, swap to @cf/meta/llama-3.2-3b-instruct
# or @cf/meta/llama-3.1-8b-instruct-fp8.
LLM_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
# speakga.org (the landing page) posts contributions to this API.
CORS_ORIGINS = "http://localhost:3000,http://localhost:5173,https://speakga.org,https://www.speakga.org"
SUPER_ADMIN_EMAIL = "ekowfirmino@gmail.com"
ACCESS_TOKEN_EXPIRE_MINUTES = "1440"

[limits]
timeout = 120

# Per-user cap on the agent's tool loop (up to 4 model calls per question).
# Deterministic answers — dictionary, verses, numbers, stories — are not counted.
[[ratelimits]]
name = "AGENT_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
